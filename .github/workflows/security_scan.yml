name: Bandit Security Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  bandit-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set Up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit Scan
        id: bandit_scan
        run: |
          bandit -r . -o bandit_report.json -f json || true
          critical_count=$(jq '[.results[] | select(.issue_severity=="CRITICAL")] | length' bandit_report.json)
          echo "critical_count=$critical_count" >> $GITHUB_ENV

      - name: Block PR if Critical Vulnerabilities Found
        if: env.critical_count > 0
        run: |
          echo "Block" > pr_comment.txt
          exit 1  # Block PR

      - name: Approve and Merge PR if No Critical Vulnerabilities
        if: env.critical_count == 0
        run: |
          echo "Successful" > pr_comment.txt
